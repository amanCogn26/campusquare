<div class="min-h-screen mt-4 overflow-x-hidden">
    <!-- Profile Info -->
    <div class="bg-white mt-4 rounded-2xl shadow-xl p-6">

        <div class="flex justify-between items-start flex-wrap gap-4">
            <div class="flex gap-10">

                @if (user?.profileImage===null) {
                <div
                    class="w-20 h-20 rounded-full border-2 border-blue-700 text-center font-bold text-5xl py-3 object-cover">
                    {{user?.name?.charAt(0) | uppercase}}</div>
                }@else{
                <img [src]="user?.profileImage" class="w-20 h-20 rounded-full border-2 object-cover shadow-lg">
                }
            
                <div>
                    <h1 class="text-3xl font-bold text-gray-800">
                        {{ user?.name }}
                    </h1>

                    <p class="text-gray-600 mt-1">
                        Student at {{user?.collegeName}}
                    </p>

                    <p class="text-sm text-gray-500 mt-2">
                        {{user?.username}}
                    </p>
                </div>
            </div>

            <button class="px-6 py-2 bg-blue-600 text-white rounded-xl hover:bg-blue-700 transition">
                Edit Profile
            </button>
        </div>

        <!-- Stats -->
        <div class="grid grid-cols-2 mt-8 gap-4">
            <div class="text-center p-4 rounded-xl bg-gray-200">
                <h3 class="text-2xl font-bold text-blue-600">
                    {{ posts.length }}
                </h3>
                <p class="text-gray-600">Posts</p>
            </div>

            <div class="text-center p-4 rounded-xl bg-gray-200 cursor-pointer" routerLink="/mynetwork">
                <h3 class="text-2xl font-bold text-blue-600">
                    0
                </h3>
                <p class="text-gray-600">Connections</p>
            </div>

            <!-- <div class="text-center p-4 rounded-xl bg-gray-200">
                <h3 class="text-2xl font-bold text-blue-600">
                    0
                </h3>
                <p class="text-gray-600">Following</p>
            </div> -->
        </div>
    </div>

    <!-- Posts -->
    <div class="my-6 border rounded-xl">

        <div class="shadow rounded-2xl grid grid-cols-2 gap-x-4 px-6">

            <app-post *ngFor="let post of posts" [post]="post"></app-post>

        </div>
    </div>

</div>

<div class="inset-0 fixed z-50 rounded-xl shadow-sm p-5 flex justify-center bg-black/50 items-center" *ngIf="addPost">

    <div class="w-150 bg-white rounded-xl p-6">

        <div class="flex gap-4 justify-between items-start">
            <div class="flex gap-4">
                <img src="https://i.pravatar.cc/150?img=12" alt="profile" class="w-12 h-12 rounded-full">

                <h2 class="font-semibold text-lg mb-4">
                    Create Post
                </h2>
            </div>
            <button (click)="editPost()" class="font-bold text-3xl cursor-pointer">X</button>
        </div>

        <form class="space-y-4 mt-2" [formGroup]="postRequestData" (ngSubmit)="formSubmit()">

            <textarea rows="10" placeholder="What's on your mind?" formControlName="description"
                class="w-full border border-gray-300 rounded-lg p-3 outline-none focus:ring-2 focus:ring-blue-500 resize-y"></textarea>

            <input type="text" formControlName="postImageUrl" class="w-full border border-gray-300 rounded-lg p-2"/>

            <select class="w-full border border-gray-300 rounded-lg p-2" formControlName="visibility">
                <option value="PUBLIC">Public</option>
                <option value="PRIVATE">Private</option>
            </select>

            <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-lg hover:bg-blue-700 cursor-pointer">
                Post
            </button>

        </form>
    </div>

</div>

<div class="flex flex-col gap-2 max-w-3xl mx-40 mt-5">

    @for(user of users; track user.id){

    <!-- Profile -->
    <div class="p-4 flex items-center justify-between border rounded-2xl w-full">

        <div class="flex gap-5 items-start">
            <img [src]="user.profileImage" class="w-12 h-12 rounded-full border-4 border-white object-cover">
            <h3 class="font-bold mt-3 text-center">
                {{ user?.name | uppercase}}
            </h3>
            <h6 class="font-sm mt-3 text-center">
                {{ user?.collegeName}}
            </h6>
        </div>


        <!-- buttom -->

        <div class="">

            <button class="bg-blue-600 text-white px-3 py-2 text-center rounded-full hover:bg-blue-700" (click)="deleteUser(user.id)">

                Delete

            </button>

        </div>

    </div>

    }

</div>

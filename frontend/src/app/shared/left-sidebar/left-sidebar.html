<div class="space-y-4 mt-22 fixed left-0 right-0 w-70 z-50">


  <div class="mt-20 w-60 h-screen bg-slate-900 text-white fixed left-0 top-0 shadow-xl">

    <!-- Profile Card -->
    <div class="text-white rounded-xl shadow-sm p-5">

      <div class="flex flex-col items-center">

        {{user?.profileImage}}

        <h2 class="mt-3 text-lg font-semibold">
          {{user?.name | uppercase}}
        </h2>
        <h2 class="mt-3 text-lg font-semibold">
          {{user?.studentId}}
        </h2>

        <p class="text-sm ">
          {{user?.collegeName | uppercase}}
        </p>

      </div>

    </div>

    <!-- Navigation -->
    <nav class="mt-4">

      <ul class="space-y-2 px-3">

        <li routerLink="/mynetwork" class="cursor-pointer">
          <a routerLinkActive="bg-slate-700"
            class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-slate-800 transition">

            <span>👥</span>
            <span>My Network</span>

          </a>
        </li>

        <li>
          <a routerLinkActive="bg-slate-700"
            class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-slate-800 transition">

            <span>📚</span>
            <span>Groups</span>
          </a>
        </li>

        <li>
          <a routerLinkActive="bg-slate-700"
            class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-slate-800 transition">

            <span>📅</span>
            <span>Events</span>
          </a>
        </li>

        <li routerLink="/chat">
          <a routerLinkActive="bg-slate-700"
            class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-slate-800 transition">
            <span>💬</span>
            <span>Messages</span>
          </a>
        </li>

        <li routerLink="/profile" class="cursor-pointer">
          <a routerLinkActive="bg-slate-700"
            class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-slate-800 transition">

            <span>
              👤
            </span>
            <span>Profile</span>
          </a>
        </li>


        <li routerLink="/admin/settings">
          <a routerLinkActive="bg-slate-700"
            class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-slate-800 transition">

            ⚙️ Settings
          </a>
        </li>

      </ul>

    </nav>

  </div>

</div>

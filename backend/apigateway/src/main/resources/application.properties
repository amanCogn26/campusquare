spring.cloud.gateway.server.webflux.routes[6].id=notification-service
spring.cloud.gateway.server.webflux.routes[6].uri=lb://notificationservice
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/notification/**

spring.cloud.gateway.server.webflux.routes[7].id=notification-websocket
spring.cloud.gateway.server.webflux.routes[7].uri=lb:ws://notificationservice
spring.cloud.gateway.server.webflux.routes[7].predicates[0]=Path=/notification-ws,/notification-ws/**

spring.cloud.gateway.server.webflux.routes[8].id=chat-service
spring.cloud.gateway.server.webflux.routes[8].uri=lb://chatservice
spring.cloud.gateway.server.webflux.routes[8].predicates[0]=Path=/chat/**

spring.cloud.gateway.server.webflux.routes[9].id=chat-websocket
spring.cloud.gateway.server.webflux.routes[9].uri=lb:ws://chatservice
spring.cloud.gateway.server.webflux.routes[9].predicates[0]=Path=/chat-ws/**


spring.application.name=apigateway

server.port=8080

jwt.secret=wqhdwqdiwndewwjncijewncienendenendijedewijneinewcewijcewcewijfniewfew

eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=true
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

spring.cloud.gateway.server.webflux.discovery.locator.enabled=true
spring.cloud.gateway.server.webflux.discovery.locator.lower-case-service-id=true

spring.cloud.gateway.server.webflux.routes[0].id=user-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://userservice
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/user/**

spring.cloud.gateway.server.webflux.routes[1].id=authentication-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://authenticationservice
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/auth/**

spring.cloud.gateway.server.webflux.routes[2].id=college-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://collegeservice
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/colleges/**

spring.cloud.gateway.server.webflux.routes[3].id=post-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://postservice
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/post/**

spring.cloud.gateway.server.webflux.routes[4].id=interaction-service
spring.cloud.gateway.server.webflux.routes[4].uri=lb://interactionservice
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/like/**,/comment/**,/ws/**

spring.cloud.gateway.server.webflux.routes[5].id=connection-service
spring.cloud.gateway.server.webflux.routes[5].uri=lb://connectionservice
